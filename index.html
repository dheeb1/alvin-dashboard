<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLIPPER · Live Dashboard</title>
<style>
  :root {
    --bg: #0b0e14;
    --bg-2: #11161f;
    --bg-3: #182030;
    --line: #1f2a3d;
    --text: #d8dee9;
    --dim: #7b88a0;
    --accent: #5cc8ff;
    --green: #3ddc97;
    --red: #ff5470;
    --yellow: #ffcc66;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: ui-monospace, "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
    font-size: 14px; line-height: 1.4;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 22px; background: var(--bg-2); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { margin: 0; font-size: 16px; letter-spacing: 1px; color: var(--accent); }
  header h1 span.session { color: var(--dim); margin-left: 10px; font-weight: normal; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px; background: var(--bg-3);
    font-size: 12px; color: var(--dim); border: 1px solid var(--line);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  .dot.on { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.off { background: var(--red); }
  .grid {
    display: grid; gap: 14px; padding: 18px 22px;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  }
  .card {
    background: var(--bg-2); border: 1px solid var(--line); border-radius: 8px;
    padding: 14px 16px;
  }
  .card .label { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.8px; }
  .card .value { font-size: 22px; margin-top: 6px; font-weight: 600; }
  .card .sub { font-size: 11px; color: var(--dim); margin-top: 4px; }
  .green { color: var(--green); }
  .red { color: var(--red); }
  .yellow { color: var(--yellow); }
  section { padding: 0 22px 24px; }
  section h2 { font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; margin: 18px 0 10px; }
  table {
    width: 100%; border-collapse: collapse; background: var(--bg-2);
    border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
    font-size: 13px;
  }
  th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { background: var(--bg-3); color: var(--dim); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; }
  tr:last-child td { border-bottom: none; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .side-CALL { color: var(--green); font-weight: 600; }
  .side-PUT { color: var(--red); font-weight: 600; }
  .empty { padding: 24px; text-align: center; color: var(--dim); }
  .scroll-x { overflow-x: auto; }
  .verdict-CALL { color: var(--green); }
  .verdict-PUT { color: var(--red); }
  .verdict-CONT { color: var(--accent); }
  .verdict-ABS_OVER { color: var(--yellow); }
  .verdict-ABS_STUCK { color: var(--dim); }
  .section-head { display: flex; align-items: center; justify-content: space-between; margin: 18px 0 10px; }
  .section-head h2 { margin: 0; }
  .btn {
    background: var(--bg-3); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 12px; font-family: inherit; font-size: 12px;
    cursor: pointer; transition: background 0.15s;
  }
  .btn:hover { background: var(--line); border-color: var(--accent); color: var(--accent); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .ratio-low { color: var(--red); }
  .ratio-mid { color: var(--yellow); }
  .ratio-hi  { color: var(--green); }
  .dim-num   { color: var(--dim); }
  footer {
    padding: 14px 22px; color: var(--dim); font-size: 11px; text-align: right;
    border-top: 1px solid var(--line); background: var(--bg-2);
  }
  .tiny { font-size: 11px; color: var(--dim); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
</style>
</head>
<body>
<header>
  <h1>FLIPPER <span class="session" id="session-date">—</span></h1>
  <div class="row">
    <span class="pill" id="mode-pill"><span class="dot"></span><span id="mode-text">…</span></span>
    <span class="pill" id="status-pill"><span class="dot" id="status-dot"></span><span id="status-text">connecting…</span></span>
    <span class="pill" id="streak-pill" style="display:none"><span id="streak-text">—</span></span>
    <span class="pill" id="regime-pill" style="display:none"><span id="regime-text">—</span></span>
    <span class="pill"><span id="last-update">—</span></span>
  </div>
</header>

<section>
  <h2>Today</h2>
  <div class="grid" id="stat-grid"></div>
</section>

<section>
  <h2>Open Positions <span class="tiny" id="open-count"></span></h2>
  <div id="open-wrap">
    <div class="empty">—</div>
  </div>
</section>

<section>
  <div class="section-head">
    <h2>Trades Today</h2>
    <button class="btn" id="csv-btn" disabled>Download CSV</button>
  </div>
  <div id="trades-wrap">
    <div class="empty">loading…</div>
  </div>
</section>

<section>
  <h2>Trade Breakdown · vol / abs / dir2x2</h2>
  <div id="breakdown-wrap" class="scroll-x">
    <div class="empty">loading…</div>
  </div>
</section>

<footer>
  <span id="generated-at">—</span> · auto-refresh every 10s ·
  <a href="?src=local" style="color:var(--dim)">local mode</a>
</footer>

<script>
  // -------- Configuration --------
  // Set this to your gist's raw URL after creating the gist.
  // Format: https://gist.githubusercontent.com/<USER>/<GIST_ID>/raw/state.json
  const GIST_RAW_URL = "https://gist.githubusercontent.com/dheeb1/ccd47f542b8de6a2b03ee7c4cd6d0202/raw/state.json";
  const LOCAL_URL = "data/state.json";
  const REFRESH_MS = 10_000;

  // ?src=local → load from data/state.json (publisher writes one locally),
  // ?src=sample → load sample_data.json
  // default → use GIST_RAW_URL
  function dataUrl() {
    const p = new URLSearchParams(location.search).get("src");
    if (p === "local") return LOCAL_URL;
    if (p === "sample") return "sample_data.json";
    return GIST_RAW_URL.includes("REPLACE_WITH") ? "sample_data.json" : GIST_RAW_URL;
  }

  // -------- Helpers --------
  const $ = (id) => document.getElementById(id);
  const fmtPct = (v) => (v == null ? "—" : (v >= 0 ? "+" : "") + v.toFixed(2) + "%");
  const fmtPctCls = (v) => v == null ? "" : v > 0 ? "green" : v < 0 ? "red" : "";
  const fmtPrice = (v) => v == null ? "—" : "$" + Number(v).toFixed(2);
  const fmtTime = (iso) => {
    if (!iso) return "—";
    try { return new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false }); }
    catch { return iso; }
  };
  const fmtDur = (sec) => {
    if (sec == null) return "—";
    if (sec < 60) return sec.toFixed(0) + "s";
    const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return `${m}m${s.toString().padStart(2, "0")}s`;
  };

  function modeText(bot) {
    if (!bot) return ["…", ""];
    const live = (bot.live_trade_types || []).length > 0;
    const win = (bot.trading_windows || [])
      .map(w => `${w.start_time || w.start}-${w.end_time || w.end}`)
      .filter(s => s !== "undefined-undefined")
      .join(",");
    if (live) {
      return [`LIVE ${bot.live_trade_types.join(",")}${win ? " @ " + win : ""}`, "yellow"];
    }
    const paperTypes = bot.paper_full_session_types || [];
    if (paperTypes.length) return [`PAPER ${paperTypes.join(",")}`, ""];
    return ["PAPER", ""];
  }

  function renderStats(snap) {
    const s = snap.stats_today || {};
    const sumCls = s.sum_pnl_pct > 0 ? "green" : s.sum_pnl_pct < 0 ? "red" : "";
    const wrCls = s.win_rate_pct >= 60 ? "green" : s.win_rate_pct < 50 ? "red" : "";
    const cards = [
      { label: "Day P&L", value: fmtPct(s.sum_pnl_pct), cls: sumCls,
        sub: `${s.wins}W · ${s.losses}L · ${s.trades_today} trades` },
      { label: "Win Rate", value: (s.win_rate_pct || 0).toFixed(0) + "%", cls: wrCls },
      { label: "Avg Win", value: fmtPct(s.avg_win_pct), cls: "green" },
      { label: "Avg Loss", value: fmtPct(s.avg_loss_pct), cls: "red" },
      { label: "Best", value: fmtPct(s.best_pct), cls: "green" },
      { label: "Worst", value: fmtPct(s.worst_pct), cls: "red" },
    ];
    $("stat-grid").innerHTML = cards.map(c =>
      `<div class="card">
         <div class="label">${c.label}</div>
         <div class="value ${c.cls || ""}">${c.value}</div>
         ${c.sub ? `<div class="sub">${c.sub}</div>` : ""}
       </div>`
    ).join("");
  }

  function renderOpenPositions(snap) {
    const positions = snap.open_positions || [];
    $("open-count").textContent = positions.length ? `· ${positions.length}` : "";
    if (!positions.length) {
      $("open-wrap").innerHTML = `<div class="empty">No open positions.</div>`;
      return;
    }
    const rows = positions.map(p => {
      const sideClass = p.side === "CALL" ? "side-CALL" : p.side === "PUT" ? "side-PUT" : "";
      const pnlCls = fmtPctCls(p.unrealized_pnl_pct);
      return `<tr>
        <td>${fmtTime(p.entry_time_iso)}</td>
        <td>${p.underlying || ""} <strong class="${sideClass}">${p.side || p.direction || ""}</strong> ${p.strike ?? ""}</td>
        <td class="num">${fmtPrice(p.entry_price)}</td>
        <td class="num">${fmtPrice(p.last_price)}</td>
        <td class="num ${pnlCls}">${fmtPct(p.unrealized_pnl_pct)}</td>
        <td class="num">${fmtPrice(p.high_price)}</td>
        <td class="num">${fmtDur(p.hold_sec)}</td>
      </tr>`;
    }).join("");
    $("open-wrap").innerHTML = `
      <table>
        <thead><tr>
          <th>Opened</th><th>Contract</th>
          <th class="num">Entry $</th><th class="num">Last $</th>
          <th class="num">Unrealized</th><th class="num">Peak $</th>
          <th class="num">Held</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  function fmtStreak(side, count) {
    if (!side || count == null) return `<span class="tiny">—</span>`;
    return `<span class="${streakClass(side)}">${side[0]}/${count}</span>`;
  }

  function renderTrades(snap) {
    const trades = snap.trades_today || [];
    if (!trades.length) {
      $("trades-wrap").innerHTML = `<div class="empty">No trades yet today.</div>`;
      $("csv-btn").disabled = true;
      return;
    }
    $("csv-btn").disabled = false;
    const rows = trades.map(t => {
      const sideClass = t.side === "CALL" ? "side-CALL" : t.side === "PUT" ? "side-PUT" : "";
      const pnlCls = fmtPctCls(t.pnl_pct);
      return `<tr>
        <td>${fmtTime(t.entry_time_iso)}</td>
        <td>${fmtTime(t.exit_time_iso)}</td>
        <td>${t.underlying || ""} <strong class="${sideClass}">${t.side || t.direction || ""}</strong> ${t.strike ?? ""}</td>
        <td class="num">${fmtPrice(t.entry_price)}</td>
        <td class="num">${fmtPrice(t.exit_price)}</td>
        <td class="num ${pnlCls}">${fmtPct(t.pnl_pct)}</td>
        <td class="num green">${fmtPct(t.mfe_pct)}</td>
        <td class="num red">${fmtPct(t.mae_pct)}</td>
        <td class="num">${fmtDur(t.hold_sec)}</td>
        <td class="num">${fmtStreak(t.s3_side, t.s3_count)}</td>
        <td class="num">${fmtStreak(t.s6_side, t.s6_count)}</td>
        <td class="num">${fmtStreak(t.s9_side, t.s9_count)}</td>
        <td class="tiny">${t.exit_reason || ""}</td>
      </tr>`;
    }).join("");
    $("trades-wrap").innerHTML = `
      <table>
        <thead><tr>
          <th>Entry</th><th>Exit</th><th>Contract</th>
          <th class="num">Entry $</th><th class="num">Exit $</th>
          <th class="num">P&L</th><th class="num">MFE</th><th class="num">MAE</th>
          <th class="num">Held</th>
          <th class="num">s3</th><th class="num">s6</th><th class="num">s9</th>
          <th>Reason</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  // -------- Breakdown table (vol / abs / dir2x2) --------
  function ratioCls(v) {
    if (v == null) return "";
    if (v < 1.0) return "ratio-low";
    if (v < 1.5) return "ratio-mid";
    return "ratio-hi";
  }
  function fmtNum(v, dp = 3) {
    if (v == null || v === "") return "—";
    const n = Number(v);
    return Number.isFinite(n) ? n.toFixed(dp) : String(v);
  }
  function verdictCell(v) {
    if (!v) return `<td>—</td>`;
    return `<td class="verdict-${v}">${v}</td>`;
  }

  function countCell(v) {
    if (v == null) return `<td class="num">—</td>`;
    const cls = v >= 3 ? "green" : "dim-num";
    return `<td class="num ${cls}">${v}</td>`;
  }

  function renderBreakdown(snap) {
    const trades = (snap.trades_today || []).filter(t => t.breakdown);
    if (!trades.length) {
      $("breakdown-wrap").innerHTML = `<div class="empty">No breakdown rows yet.</div>`;
      return;
    }
    const rows = trades.map(t => {
      const b = t.breakdown;
      const sideClass = t.side === "CALL" ? "side-CALL" : t.side === "PUT" ? "side-PUT" : "";
      const pnlCls = fmtPctCls(t.pnl_pct);
      const vr = (k) => `<td class="num ${ratioCls(b[k])}">${b[k] == null ? "—" : Number(b[k]).toFixed(2)}</td>`;
      const ab = (k) => `<td class="num">${fmtNum(b[k], 3)}</td>`;
      return `<tr>
        <td>${fmtTime(t.entry_time_iso)}</td>
        <td><strong class="${sideClass}">${t.side || t.direction || ""}</strong></td>
        <td class="num ${pnlCls}">${fmtPct(t.pnl_pct)}</td>
        ${vr("vol_ratio_1m")}${vr("vol_ratio_3m")}${vr("vol_ratio_6m")}${vr("vol_ratio_9m")}${vr("vol_ratio_15m")}
        ${ab("abs_1m")}${ab("abs_3m")}${ab("abs_6m")}${ab("abs_9m")}${ab("abs_15m")}
        ${verdictCell(b.d2_v1)}${verdictCell(b.d2_v3)}${verdictCell(b.d2_v6)}${verdictCell(b.d2_v9)}${verdictCell(b.d2_v15)}
        ${countCell(b.d2_call_count)}
        ${countCell(b.d2_put_count)}
        ${verdictCell(b.d2_direction)}
      </tr>`;
    }).join("");
    $("breakdown-wrap").innerHTML = `
      <div class="tiny" style="margin-bottom:6px">
        DIR2X2: 5 voters (1m/3m/6m/9m/15m) · needs ≥3 of 5 to fire ·
        Abs gate: ≥2 of {1,3,5,15}m ≤ 0.90 (5m used in gate, not displayed) ·
        Vol gate: r15m ≥ 1.05
      </div>
      <table>
        <thead>
          <tr>
            <th rowspan="2">Entry</th>
            <th rowspan="2">Side</th>
            <th rowspan="2" class="num">P&L</th>
            <th colspan="5" style="text-align:center">Vol Ratio (× sessavg)</th>
            <th colspan="5" style="text-align:center">Absorption Avg</th>
            <th colspan="5" style="text-align:center">DIR2X2 Verdict</th>
            <th rowspan="2" class="num">C</th>
            <th rowspan="2" class="num">P</th>
            <th rowspan="2">D2 Dir</th>
          </tr>
          <tr>
            <th class="num">1m</th><th class="num">3m</th><th class="num">6m</th><th class="num">9m</th><th class="num">15m</th>
            <th class="num">1m</th><th class="num">3m</th><th class="num">6m</th><th class="num">9m</th><th class="num">15m</th>
            <th>1m</th><th>3m</th><th>6m</th><th>9m</th><th>15m</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  // -------- CSV export --------
  // Flatten one trade (top-level + breakdown.*) into a single row dict
  function flattenTrade(t) {
    const flat = {};
    for (const k of Object.keys(t)) {
      if (k === "breakdown") continue;
      flat[k] = t[k];
    }
    if (t.breakdown) {
      for (const k of Object.keys(t.breakdown)) {
        flat[k] = t.breakdown[k];
      }
    }
    return flat;
  }
  function csvEscape(v) {
    if (v == null) return "";
    const s = String(v);
    if (/[",\n\r]/.test(s)) return `"${s.replace(/"/g, '""')}"`;
    return s;
  }
  function buildCsv(trades) {
    if (!trades.length) return "";
    const flats = trades.map(flattenTrade);
    // Union of all keys, preserving first-seen order
    const seen = new Set();
    const cols = [];
    for (const r of flats) {
      for (const k of Object.keys(r)) {
        if (!seen.has(k)) { seen.add(k); cols.push(k); }
      }
    }
    const lines = [cols.join(",")];
    for (const r of flats) lines.push(cols.map(c => csvEscape(r[c])).join(","));
    return lines.join("\r\n");
  }
  function downloadCsv(snap) {
    const trades = snap?.trades_today || [];
    if (!trades.length) return;
    const csv = buildCsv(trades);
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `flipper_${snap.session_date || "today"}_trade_breakdown.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 0);
  }

  function streakClass(side) {
    return side === "CALL" ? "verdict-CALL" : side === "PUT" ? "verdict-PUT" : "";
  }
  function regimeClass(r) {
    if (r == null) return "";
    if (r <= 1.5) return "green";  // trend
    if (r > 3.0) return "red";     // chop
    return "";                     // normal band
  }

  function setStatus(snap) {
    const bot = snap?.bot || {};
    $("session-date").textContent = snap?.session_date || "—";
    const dot = $("status-dot");
    if (bot.running) { dot.classList.add("on"); dot.classList.remove("off"); $("status-text").textContent = "BOT RUNNING"; }
    else { dot.classList.add("off"); dot.classList.remove("on"); $("status-text").textContent = `BOT STOPPED (${bot.seconds_since_heartbeat ?? "?"}s)`; }
    const [mt, mc] = modeText(bot);
    $("mode-text").textContent = mt;
    $("mode-text").className = mc;

    // s9 streak pill — hide if oracle hasn't logged anything yet
    const oracle = snap?.live_oracle;
    if (oracle && oracle.s9_side && oracle.s9_count != null) {
      $("streak-pill").style.display = "";
      $("streak-text").innerHTML = `s9 · <span class="${streakClass(oracle.s9_side)}">${oracle.s9_side} ${oracle.s9_count}</span>`;
    } else {
      $("streak-pill").style.display = "none";
    }

    // range/ORB regime pill — hide if no journal data yet
    const regime = snap?.live_regime;
    if (regime && regime.range_orb_ratio != null) {
      $("regime-pill").style.display = "";
      const r = regime.range_orb_ratio;
      $("regime-text").innerHTML = `R/ORB · <span class="${regimeClass(r)}">${r.toFixed(2)}</span>`;
    } else {
      $("regime-pill").style.display = "none";
    }

    $("generated-at").textContent = `generated ${fmtTime(snap?.generated_at_iso)}`;
  }

  let lastOk = null;
  let lastSnap = null;
  async function tick() {
    try {
      // Cache-buster: gist raw URLs are CDN-cached up to ~60s; this nudges a fresh fetch.
      const url = dataUrl() + (dataUrl().includes("?") ? "&" : "?") + "_=" + Date.now();
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const snap = await res.json();
      lastSnap = snap;
      setStatus(snap);
      renderStats(snap);
      renderOpenPositions(snap);
      renderTrades(snap);
      renderBreakdown(snap);
      lastOk = new Date();
      $("last-update").textContent = "updated " + lastOk.toLocaleTimeString([], { hour12: false });
    } catch (e) {
      $("last-update").textContent = "fetch failed: " + e.message;
      $("last-update").className = "red";
    }
  }
  $("csv-btn").addEventListener("click", () => { if (lastSnap) downloadCsv(lastSnap); });
  tick();
  setInterval(tick, REFRESH_MS);
</script>
</body>
</html>
