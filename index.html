<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLIPPER · Live Dashboard</title>
<style>
  :root {
    --bg: #0b0e14;
    --bg-2: #11161f;
    --bg-3: #182030;
    --line: #1f2a3d;
    --text: #d8dee9;
    --dim: #7b88a0;
    --accent: #5cc8ff;
    --green: #3ddc97;
    --red: #ff5470;
    --yellow: #ffcc66;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: ui-monospace, "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
    font-size: 14px; line-height: 1.4;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 22px; background: var(--bg-2); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { margin: 0; font-size: 16px; letter-spacing: 1px; color: var(--accent); }
  header h1 span.session { color: var(--dim); margin-left: 10px; font-weight: normal; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px; background: var(--bg-3);
    font-size: 12px; color: var(--dim); border: 1px solid var(--line);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  .dot.on { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.off { background: var(--red); }
  .grid {
    display: grid; gap: 14px; padding: 18px 22px;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  }
  .card {
    background: var(--bg-2); border: 1px solid var(--line); border-radius: 8px;
    padding: 14px 16px;
  }
  .card .label { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.8px; }
  .card .value { font-size: 22px; margin-top: 6px; font-weight: 600; }
  .card .sub { font-size: 11px; color: var(--dim); margin-top: 4px; }
  .green { color: var(--green); }
  .red { color: var(--red); }
  .yellow { color: var(--yellow); }
  section { padding: 0 22px 24px; }
  section h2 { font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; margin: 18px 0 10px; }
  table {
    width: 100%; border-collapse: collapse; background: var(--bg-2);
    border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
    font-size: 13px;
  }
  th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { background: var(--bg-3); color: var(--dim); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; }
  tr:last-child td { border-bottom: none; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .side-CALL { color: var(--green); font-weight: 600; }
  .side-PUT { color: var(--red); font-weight: 600; }
  .empty { padding: 24px; text-align: center; color: var(--dim); }
  .scroll-x { overflow-x: auto; }
  .verdict-CALL { color: var(--green); }
  .verdict-PUT { color: var(--red); }
  .verdict-CONT { color: var(--accent); }
  .verdict-ABS_OVER { color: var(--yellow); }
  .verdict-ABS_STUCK { color: var(--dim); }
  .calc-MATCH    { color: var(--green); font-weight: 600; }
  .calc-OPPOSITE { color: var(--red); font-weight: 700; background: rgba(255,80,80,0.10); }
  .calc-NONE     { color: var(--dim); }
  .picker-high   { color: var(--green); font-weight: 700; }
  .picker-low    { color: var(--dim); }
  .stacked-pass  { background: rgba(80,200,120,0.10); }
  .star          { color: var(--accent); font-weight: 700; }
  .watch-strip   { padding: 6px 8px; background: var(--bg-3); border-radius: 4px; margin-bottom: 6px; font-size: 11px; }
  .watch-strip strong { color: var(--text); }
  .section-head { display: flex; align-items: center; justify-content: space-between; margin: 18px 0 10px; }
  .section-head h2 { margin: 0; }
  .btn {
    background: var(--bg-3); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 12px; font-family: inherit; font-size: 12px;
    cursor: pointer; transition: background 0.15s;
  }
  .btn:hover { background: var(--line); border-color: var(--accent); color: var(--accent); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .ratio-low { color: var(--red); }
  .ratio-mid { color: var(--yellow); }
  .ratio-hi  { color: var(--green); }
  .dim-num   { color: var(--dim); }
  footer {
    padding: 14px 22px; color: var(--dim); font-size: 11px; text-align: right;
    border-top: 1px solid var(--line); background: var(--bg-2);
  }
  .tiny { font-size: 11px; color: var(--dim); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
</style>
</head>
<body>
<header>
  <h1>FLIPPER <span class="session" id="session-date">—</span></h1>
  <div class="row">
    <span class="pill" id="mode-pill"><span class="dot"></span><span id="mode-text">…</span></span>
    <span class="pill" id="status-pill"><span class="dot" id="status-dot"></span><span id="status-text">connecting…</span></span>
    <!-- 2026-05-18 PM — streak-pill (oracle) and m-pill (BUILD ladder) retired.
         iva-pill replaces them as the primary live-state indicator. -->
    <span class="pill" id="iva-pill" style="display:none"><span id="iva-text">—</span></span>
    <span class="pill" id="regime-pill" style="display:none"><span id="regime-text">—</span></span>
    <span class="pill"><span id="last-update">—</span></span>
  </div>
</header>

<section>
  <h2>Today</h2>
  <div class="grid" id="stat-grid"></div>
</section>

<section>
  <h2>Open Positions <span class="tiny" id="open-count"></span></h2>
  <div id="open-wrap">
    <div class="empty">—</div>
  </div>
</section>

<section>
  <div class="section-head">
    <h2>Trades Today</h2>
    <div>
      <button class="btn" id="csv-btn" disabled>Download CSV</button>
      <a class="btn" id="tape-csv-btn" href="#" style="text-decoration:none;display:inline-block;margin-left:6px;">Download Tape CSV</a>
    </div>
  </div>
  <div id="trades-wrap">
    <div class="empty">loading…</div>
  </div>
</section>

<section>
  <h2>Trade Breakdown · IVA + 1v1 inputs at entry</h2>
  <div id="breakdown-wrap" class="scroll-x">
    <div class="empty">loading…</div>
  </div>
</section>

<footer>
  <span id="generated-at">—</span> · auto-refresh every 10s ·
  <a href="?src=local" style="color:var(--dim)">local mode</a>
</footer>

<script>
  // -------- Configuration --------
  // Set this to your gist's raw URL after creating the gist.
  // Format: https://gist.githubusercontent.com/<USER>/<GIST_ID>/raw/state.json
  const GIST_RAW_URL = "https://gist.githubusercontent.com/dheeb1/ccd47f542b8de6a2b03ee7c4cd6d0202/raw/state.json";
  const LOCAL_URL = "data/state.json";
  // 2026-05-18 PM — per-tick tape CSV lives in the same gist, separate file.
  // Publisher pushes both alongside each cycle.
  // 2026-05-19 — CSV expanded from 15 → 25 cols: added imb_3m/abs_3m/vol_3m,
  // 1m+3m sums, sum-bursts, and renamed IVA_burst → IVA_1m (was always a
  // level not a burst) plus new IVA_sum. Data-collection only — bot still
  // trades on IVA_ABS gate; sum cols are smoothing experiments for later.
  const GIST_TAPE_CSV_URL = GIST_RAW_URL.replace(/\/raw\/state\.json.*$/, "/raw/tick_tape_today.csv");
  const LOCAL_TAPE_CSV_URL = "data/tick_tape_today.csv";
  const REFRESH_MS = 10_000;

  // ?src=local → load from data/state.json (publisher writes one locally),
  // ?src=sample → load sample_data.json
  // default → use GIST_RAW_URL
  function dataUrl() {
    const p = new URLSearchParams(location.search).get("src");
    if (p === "local") return LOCAL_URL;
    if (p === "sample") return "sample_data.json";
    return GIST_RAW_URL.includes("REPLACE_WITH") ? "sample_data.json" : GIST_RAW_URL;
  }
  function tapeCsvUrl() {
    const p = new URLSearchParams(location.search).get("src");
    if (p === "local") return LOCAL_TAPE_CSV_URL;
    return GIST_TAPE_CSV_URL;
  }

  // -------- Helpers --------
  const $ = (id) => document.getElementById(id);
  const fmtPct = (v) => (v == null ? "—" : (v >= 0 ? "+" : "") + v.toFixed(2) + "%");
  const fmtPctCls = (v) => v == null ? "" : v > 0 ? "green" : v < 0 ? "red" : "";
  const fmtPrice = (v) => v == null ? "—" : "$" + Number(v).toFixed(2);
  // 2026-05-15 — dollar P&L. Signed with no cents on totals; cents kept on
  // per-trade rows so small tape-mid wiggles ($0.50 type) don't round to zero.
  const fmtDollars = (v, cents = true) => {
    if (v == null) return "—";
    const n = Number(v);
    if (!Number.isFinite(n)) return "—";
    const sign = n > 0 ? "+" : n < 0 ? "-" : "";
    const abs = Math.abs(n);
    return sign + "$" + (cents ? abs.toFixed(2) : Math.round(abs).toString());
  };
  const fmtTime = (iso) => {
    if (!iso) return "—";
    try { return new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false }); }
    catch { return iso; }
  };
  const fmtDur = (sec) => {
    if (sec == null) return "—";
    if (sec < 60) return sec.toFixed(0) + "s";
    const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return `${m}m${s.toString().padStart(2, "0")}s`;
  };

  function modeText(bot) {
    if (!bot) return ["…", ""];
    const live = (bot.live_trade_types || []).length > 0;
    const win = (bot.trading_windows || [])
      .map(w => `${w.start_time || w.start}-${w.end_time || w.end}`)
      .filter(s => s !== "undefined-undefined")
      .join(",");
    if (live) {
      return [`LIVE ${bot.live_trade_types.join(",")}${win ? " @ " + win : ""}`, "yellow"];
    }
    const paperTypes = bot.paper_full_session_types || [];
    if (paperTypes.length) return [`PAPER ${paperTypes.join(",")}`, ""];
    return ["PAPER", ""];
  }

  function renderStats(snap) {
    const s = snap.stats_today || {};
    const sumCls = s.sum_pnl_pct > 0 ? "green" : s.sum_pnl_pct < 0 ? "red" : "";
    const wrCls = s.win_rate_pct >= 60 ? "green" : s.win_rate_pct < 50 ? "red" : "";
    // 2026-05-15 — $ P&L wired in (NET of commission). Day P&L card leads
    // with the real-money net; subtitle shows gross / commission / W-L so the
    // math is auditable. Avg Win / Loss / Best / Worst show $ underneath %
    // (also NET — winners shrink by $1.60, losers grow by $1.60 vs gross).
    const grossSub = (s.sum_pnl_dollars_gross != null && s.commission_total_dollars != null)
      ? ` (gross ${fmtDollars(s.sum_pnl_dollars_gross, false)} − ${fmtDollars(s.commission_total_dollars, false).replace("-","").replace("+","")} comm)`
      : "";
    const cards = [
      { label: "Day P&L (net)", value: fmtDollars(s.sum_pnl_dollars, false), cls: sumCls,
        sub: `${fmtPct(s.sum_pnl_pct)} · ${s.wins}W · ${s.losses}L · ${s.trades_today} trades${grossSub}` },
      { label: "Win Rate", value: (s.win_rate_pct || 0).toFixed(0) + "%", cls: wrCls },
      { label: "Commission", value: fmtDollars(s.commission_total_dollars ? -Math.abs(s.commission_total_dollars) : 0, false),
        cls: "yellow",
        sub: `${s.trades_today || 0} trades × round-trip` },
      { label: "Avg Win", value: fmtPct(s.avg_win_pct), cls: "green",
        sub: fmtDollars(s.avg_win_dollars) },
      { label: "Avg Loss", value: fmtPct(s.avg_loss_pct), cls: "red",
        sub: fmtDollars(s.avg_loss_dollars) },
      { label: "Best", value: fmtPct(s.best_pct), cls: "green",
        sub: fmtDollars(s.best_dollars) },
      { label: "Worst", value: fmtPct(s.worst_pct), cls: "red",
        sub: fmtDollars(s.worst_dollars) },
    ];
    $("stat-grid").innerHTML = cards.map(c =>
      `<div class="card">
         <div class="label">${c.label}</div>
         <div class="value ${c.cls || ""}">${c.value}</div>
         ${c.sub ? `<div class="sub">${c.sub}</div>` : ""}
       </div>`
    ).join("");
  }

  function renderOpenPositions(snap) {
    const positions = snap.open_positions || [];
    $("open-count").textContent = positions.length ? `· ${positions.length}` : "";
    if (!positions.length) {
      $("open-wrap").innerHTML = `<div class="empty">No open positions.</div>`;
      return;
    }
    const rows = positions.map(p => {
      const sideClass = p.side === "CALL" ? "side-CALL" : p.side === "PUT" ? "side-PUT" : "";
      const pnlCls = fmtPctCls(p.unrealized_pnl_pct);
      return `<tr>
        <td>${fmtTime(p.entry_time_iso)}</td>
        <td>${p.underlying || ""} <strong class="${sideClass}">${p.side || p.direction || ""}</strong> ${p.strike ?? ""}</td>
        <td class="num">${fmtPrice(p.entry_price)}</td>
        <td class="num">${fmtPrice(p.last_price)}</td>
        <td class="num ${pnlCls}">${fmtPct(p.unrealized_pnl_pct)}</td>
        <td class="num ${pnlCls}">${fmtDollars(p.unrealized_pnl_dollars)}</td>
        <td class="num">${fmtPrice(p.high_price)}</td>
        <td class="num">${fmtDur(p.hold_sec)}</td>
      </tr>`;
    }).join("");
    $("open-wrap").innerHTML = `
      <table>
        <thead><tr>
          <th>Opened</th><th>Contract</th>
          <th class="num">Entry $</th><th class="num">Last $</th>
          <th class="num">Unreal %</th><th class="num">Unreal $</th>
          <th class="num">Peak $</th>
          <th class="num">Held</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  function fmtStreak(side, count) {
    if (!side || count == null) return `<span class="tiny">—</span>`;
    return `<span class="${streakClass(side)}">${side[0]}/${count}</span>`;
  }

  function renderTrades(snap) {
    // 2026-05-18 PM — oracle (s6/s12/s27) columns removed. Trade Route shown
    // instead so IVA_1V1 trades are visually distinguishable from any legacy
    // BUILD / SCALP / MANUAL trades still landing in the table.
    const trades = snap.trades_today || [];
    if (!trades.length) {
      $("trades-wrap").innerHTML = `<div class="empty">No trades yet today.</div>`;
      $("csv-btn").disabled = true;
      return;
    }
    $("csv-btn").disabled = false;
    const rows = trades.map(t => {
      const sideClass = t.side === "CALL" ? "side-CALL" : t.side === "PUT" ? "side-PUT" : "";
      const pnlCls = fmtPctCls(t.pnl_pct);
      const routeCls = t.route === "IVA_1V1" ? "star" : "dim-num";
      return `<tr>
        <td>${fmtTime(t.entry_time_iso)}</td>
        <td>${fmtTime(t.exit_time_iso)}</td>
        <td>${t.underlying || ""} <strong class="${sideClass}">${t.side || t.direction || ""}</strong> ${t.strike ?? ""}</td>
        <td class="${routeCls}">${t.route || "—"}</td>
        <td class="num">${fmtPrice(t.entry_price)}</td>
        <td class="num">${fmtPrice(t.exit_price)}</td>
        <td class="num ${pnlCls}">${fmtPct(t.pnl_pct)}</td>
        <td class="num ${pnlCls}">${fmtDollars(t.pnl_dollars)}</td>
        <td class="num green">${fmtPct(t.mfe_pct)}</td>
        <td class="num red">${fmtPct(t.mae_pct)}</td>
        <td class="num">${fmtDur(t.hold_sec)}</td>
        <td class="tiny">${t.exit_reason || ""}</td>
      </tr>`;
    }).join("");
    $("trades-wrap").innerHTML = `
      <table>
        <thead><tr>
          <th>Entry</th><th>Exit</th><th>Contract</th><th>Route</th>
          <th class="num">Entry $</th><th class="num">Exit $</th>
          <th class="num">P&L %</th><th class="num">P&L $</th>
          <th class="num">MFE</th><th class="num">MAE</th>
          <th class="num">Held</th>
          <th>Reason</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  // -------- Breakdown table (IVA + 1v1 inputs at entry) --------
  // 2026-05-18 PM rebuild — DIR2X2 breakdown replaced with the IVA+1v1 rule's
  // inputs. Per trade we show: IVA score at entry (the gate), sumImb / sumAbs
  // / sumVol (the gate components), buy_1m / sell_1m / 1v1Tick (the
  // directional engine), and r1m / r3m / r6m at entry (the consensus state
  // the trade was fired on). Wide-but-flat layout, color-coded by sign.
  function fmtInt(v) {
    if (v == null) return "—";
    const n = Number(v);
    if (!Number.isFinite(n)) return "—";
    const sign = n > 0 ? "+" : "";
    return sign + Math.round(n).toLocaleString();
  }
  function fmtFloat(v, dp = 2) {
    if (v == null) return "—";
    const n = Number(v);
    return Number.isFinite(n) ? n.toFixed(dp) : "—";
  }
  function signedCell(v, dp = 0) {
    if (v == null) return `<td class="num dim-num">—</td>`;
    const n = Number(v);
    if (!Number.isFinite(n)) return `<td class="num dim-num">—</td>`;
    const cls = n > 0 ? "green" : n < 0 ? "red" : "dim-num";
    return `<td class="num ${cls}">${dp === 0 ? fmtInt(n) : fmtFloat(n, dp)}</td>`;
  }
  function ivaCell(v, threshold) {
    if (v == null) return `<td class="num dim-num">—</td>`;
    const n = Number(v);
    if (!Number.isFinite(n)) return `<td class="num dim-num">—</td>`;
    const cls = n >= (threshold || 12) ? "red" : n >= 6 ? "yellow" : "dim-num";
    return `<td class="num ${cls}"><strong>${n.toFixed(2)}</strong></td>`;
  }

  function renderBreakdown(snap) {
    const trades = (snap.trades_today || []).filter(t => t.breakdown);
    if (!trades.length) {
      $("breakdown-wrap").innerHTML = `<div class="empty">No breakdown rows yet.</div>`;
      return;
    }

    // Session counters: IVA_1V1 trades vs other, WR + bp aggregates per route.
    let n_iva = 0, w_iva = 0, pnl_iva = 0;
    let n_other = 0, w_other = 0, pnl_other = 0;
    for (const t of trades) {
      const pnl = Number(t.pnl_pct);
      const win = Number.isFinite(pnl) && pnl > 0 ? 1 : 0;
      const safePnl = Number.isFinite(pnl) ? pnl : 0;
      if (t.route === "IVA_1V1") { n_iva++; w_iva += win; pnl_iva += safePnl; }
      else                       { n_other++; w_other += win; pnl_other += safePnl; }
    }
    const wr = (w, n) => n ? `${Math.round(w/n*100)}%` : "—";
    const sign = (v) => (v>=0?'+':'') + v.toFixed(1) + '%';
    const summary = `
      <span class="star">IVA_1V1: ${n_iva} (${wr(w_iva,n_iva)} WR, ${sign(pnl_iva)})</span>
      ${n_other ? ` · <span class="dim-num">Other routes: ${n_other} (${wr(w_other,n_other)} WR, ${sign(pnl_other)})</span>` : ""}
    `;

    const threshold = (snap.live_iva && snap.live_iva.threshold) || 12;
    const rows = trades.map(t => {
      const b = t.breakdown || {};
      const sideClass = t.side === "CALL" ? "side-CALL" : t.side === "PUT" ? "side-PUT" : "";
      const pnlCls = fmtPctCls(t.pnl_pct);
      const routeCls = t.route === "IVA_1V1" ? "star" : "dim-num";
      const star = t.route === "IVA_1V1" ? "★" : "";
      return `<tr>
        <td class="${routeCls}">${star}</td>
        <td>${fmtTime(t.entry_time_iso)}</td>
        <td><strong class="${sideClass}">${t.side || t.direction || ""}</strong></td>
        <td class="num ${pnlCls}">${fmtPct(t.pnl_pct)}</td>
        ${ivaCell(b.iva_score, threshold)}
        <td class="num">${fmtFloat(b.sum_imb, 2)}</td>
        <td class="num">${fmtFloat(b.sum_abs, 2)}</td>
        <td class="num">${fmtFloat(b.sum_vol, 2)}</td>
        <td class="num green">${fmtInt(b.buy_1m)}</td>
        <td class="num red">${b.sell_1m == null ? "—" : "−" + Math.abs(Math.round(b.sell_1m)).toLocaleString()}</td>
        ${signedCell(b.v1v_tick, 0)}
        ${signedCell(b.iva_r1m, 0)}
        ${signedCell(b.iva_r3m, 0)}
        ${signedCell(b.iva_r6m, 0)}
      </tr>`;
    }).join("");
    $("breakdown-wrap").innerHTML = `
      <div class="tiny" style="margin-bottom:6px">
        IVA = sumImb × sumVol / sumAbs (gate threshold ${threshold}) ·
        1v1Tick = buy_1m − sell_1m (per-tick directional pressure) ·
        r1m/r3m/r6m = rolling sums of 1v1Tick over ~60s / ~170s / ~342s ·
        Entry = IVA ≥ ${threshold} AND all three r1m/r3m/r6m agree on sign ·
        Exit = all three flip against the position
      </div>
      <div class="watch-strip">
        <strong>Today by route</strong>: ${summary}
      </div>
      <table>
        <thead>
          <tr>
            <th></th>
            <th>Entry</th>
            <th>Side</th>
            <th class="num">P&L</th>
            <th class="num">IVA</th>
            <th class="num">sumImb</th>
            <th class="num">sumAbs</th>
            <th class="num">sumVol</th>
            <th class="num">buy_1m</th>
            <th class="num">sell_1m</th>
            <th class="num">1v1Tick</th>
            <th class="num">r1m</th>
            <th class="num">r3m</th>
            <th class="num">r6m</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  // -------- CSV export --------
  // Flatten one trade (top-level + breakdown.*) into a single row dict
  function flattenTrade(t) {
    const flat = {};
    for (const k of Object.keys(t)) {
      if (k === "breakdown") continue;
      flat[k] = t[k];
    }
    if (t.breakdown) {
      for (const k of Object.keys(t.breakdown)) {
        flat[k] = t.breakdown[k];
      }
    }
    return flat;
  }
  function csvEscape(v) {
    if (v == null) return "";
    const s = String(v);
    if (/[",\n\r]/.test(s)) return `"${s.replace(/"/g, '""')}"`;
    return s;
  }
  function buildCsv(trades) {
    if (!trades.length) return "";
    const flats = trades.map(flattenTrade);
    // Union of all keys, preserving first-seen order
    const seen = new Set();
    const cols = [];
    for (const r of flats) {
      for (const k of Object.keys(r)) {
        if (!seen.has(k)) { seen.add(k); cols.push(k); }
      }
    }
    const lines = [cols.join(",")];
    for (const r of flats) lines.push(cols.map(c => csvEscape(r[c])).join(","));
    return lines.join("\r\n");
  }
  function downloadCsv(snap) {
    const trades = snap?.trades_today || [];
    if (!trades.length) return;
    const csv = buildCsv(trades);
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `flipper_${snap.session_date || "today"}_trade_breakdown.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 0);
  }

  function streakClass(side) {
    return side === "CALL" ? "verdict-CALL" : side === "PUT" ? "verdict-PUT" : "";
  }
  function regimeClass(r) {
    if (r == null) return "";
    if (r <= 1.5) return "green";  // trend
    if (r > 3.0) return "red";     // chop
    return "";                     // normal band
  }

  function setStatus(snap) {
    const bot = snap?.bot || {};
    $("session-date").textContent = snap?.session_date || "—";
    const dot = $("status-dot");
    if (bot.running) { dot.classList.add("on"); dot.classList.remove("off"); $("status-text").textContent = "BOT RUNNING"; }
    else { dot.classList.add("off"); dot.classList.remove("on"); $("status-text").textContent = `BOT STOPPED (${bot.seconds_since_heartbeat ?? "?"}s)`; }
    const [mt, mc] = modeText(bot);
    $("mode-text").textContent = mt;
    $("mode-text").className = mc;

    // 2026-05-18 PM — IVA+1v1 live pill. Replaces the old s27 streak pill
    // and m pill (oracle retired, BUILD ladder bypassed). Shows the live
    // gate score + the three rolling consensus sums + side state. Hidden
    // when iva_state.json is missing or stale.
    const iva = snap?.live_iva;
    if (iva && iva.iva_last != null) {
      $("iva-pill").style.display = "";
      const score = Number(iva.iva_last);
      const thr = iva.threshold || 12;
      const scoreCls = score >= thr ? "red" : score >= 6 ? "yellow" : "";
      const armed = iva.safety_off ? '<span class="red">★armed</span>' : '<span class="dim-num">cold</span>';
      const sideTxt = iva.side ? `<strong class="side-${iva.side}">${iva.side}</strong>` : '<span class="dim-num">FLAT</span>';
      const r1 = Number(iva.r1m || 0);
      const r3 = Number(iva.r3m || 0);
      const r6 = Number(iva.r6m || 0);
      const c1 = r1 > 0 ? "green" : r1 < 0 ? "red" : "dim-num";
      const c3 = r3 > 0 ? "green" : r3 < 0 ? "red" : "dim-num";
      const c6 = r6 > 0 ? "green" : r6 < 0 ? "red" : "dim-num";
      const k = (n) => Math.abs(n) >= 1000 ? (n/1000).toFixed(1) + "k" : Math.round(n).toString();
      const sign = (n) => n > 0 ? "+" : n < 0 ? "−" : "";
      $("iva-text").innerHTML =
        `IVA <span class="${scoreCls}"><strong>${score.toFixed(2)}</strong></span> ${armed} · ` +
        `<span class="${c1}">${sign(r1)}${k(Math.abs(r1))}</span>/` +
        `<span class="${c3}">${sign(r3)}${k(Math.abs(r3))}</span>/` +
        `<span class="${c6}">${sign(r6)}${k(Math.abs(r6))}</span> · ${sideTxt}`;
    } else {
      $("iva-pill").style.display = "none";
    }

    // range/ORB regime pill — kept as observational context. Hide if no data.
    const regime = snap?.live_regime;
    if (regime && regime.range_orb_ratio != null) {
      $("regime-pill").style.display = "";
      const r = regime.range_orb_ratio;
      $("regime-text").innerHTML = `R/ORB · <span class="${regimeClass(r)}">${r.toFixed(2)}</span>`;
    } else {
      $("regime-pill").style.display = "none";
    }

    $("generated-at").textContent = `generated ${fmtTime(snap?.generated_at_iso)}`;
  }

  let lastOk = null;
  let lastSnap = null;
  async function tick() {
    try {
      // Cache-buster: gist raw URLs are CDN-cached up to ~60s; this nudges a fresh fetch.
      const url = dataUrl() + (dataUrl().includes("?") ? "&" : "?") + "_=" + Date.now();
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const snap = await res.json();
      lastSnap = snap;
      setStatus(snap);
      renderStats(snap);
      renderOpenPositions(snap);
      renderTrades(snap);
      renderBreakdown(snap);
      lastOk = new Date();
      $("last-update").textContent = "updated " + lastOk.toLocaleTimeString([], { hour12: false });
    } catch (e) {
      $("last-update").textContent = "fetch failed: " + e.message;
      $("last-update").className = "red";
    }
  }
  $("csv-btn").addEventListener("click", () => { if (lastSnap) downloadCsv(lastSnap); });
  // 2026-05-19 — tape CSV button: blob-download to force save. The HTML
  // download attr is ignored cross-origin (gist is a different origin than
  // GitHub Pages), so anchor-with-href just rendered the CSV inline. Fetch
  // the file, wrap in a Blob (same-origin), trigger a temp anchor click,
  // revoke the object URL. Works against both gist and local mirror.
  $("tape-csv-btn").addEventListener("click", async (ev) => {
    ev.preventDefault();
    const btn = $("tape-csv-btn");
    const original = btn.textContent;
    const base = tapeCsvUrl();
    const url = base + (base.includes("?") ? "&" : "?") + "_=" + Date.now();
    btn.textContent = "Downloading...";
    try {
      const resp = await fetch(url, { cache: "no-store" });
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      const blob = await resp.blob();
      const objUrl = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = objUrl;
      a.download = "tick_tape_today.csv";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(objUrl);
      btn.textContent = original;
    } catch (e) {
      btn.textContent = "Error: " + e.message;
      setTimeout(() => { btn.textContent = original; }, 4000);
    }
  });
  tick();
  setInterval(tick, REFRESH_MS);
</script>
</body>
</html>
