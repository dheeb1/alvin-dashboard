<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CREED</title>
<style>
  :root {
    color-scheme: dark;
    --page:        #0d0d0d;
    --surface:     #1a1a19;
    --ink:         #ffffff;
    --ink-2:       #c3c2b7;
    --muted:       #898781;
    --grid:        #2c2c2a;
    --ring:        rgba(255,255,255,0.10);
    --good:        #0ca30c;
    --warning:     #fab219;
    --serious:     #ec835a;
    --critical:    #d03b3b;
    --up:          #0ca30c;
    --down:        #e66767;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    background: var(--page); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 20px; max-width: 980px; margin: 0 auto;
  }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  header h1 { font-size: 22px; letter-spacing: 4px; font-weight: 700; }
  header .sub { color: var(--muted); font-size: 13px; }
  .stale { color: var(--warning); }
  .banner {
    border: 1px solid var(--ring); border-left: 4px solid var(--critical);
    background: var(--surface); border-radius: 8px; padding: 12px 16px; margin-bottom: 16px;
  }
  .banner div { display: flex; gap: 8px; align-items: baseline; padding: 2px 0; }
  .banner .lvl { font-size: 12px; font-weight: 700; letter-spacing: 1px; }
  .lvl.critical { color: var(--critical); } .lvl.serious { color: var(--serious); }
  .lvl.warning { color: var(--warning); }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); margin-bottom: 16px; }
  .card {
    background: var(--surface); border: 1px solid var(--ring);
    border-radius: 10px; padding: 14px 16px;
  }
  .card h2 { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 8px; }
  .big { font-size: 26px; font-weight: 700; }
  .statusline { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .dot.up { background: var(--up); } .dot.down { background: var(--down); }
  .dot.off { background: var(--muted); }
  .sub2 { color: var(--ink-2); font-size: 13px; margin-top: 4px; }
  .pl-pos { color: var(--good); } .pl-neg { color: var(--down); }
  section.block { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
  section.block h2 { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 10px; }
  .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .tag { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--ring); border-radius: 999px; padding: 3px 10px; font-size: 13px; color: var(--ink-2); }
  .tag .dot { width: 8px; height: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 600; padding: 4px 8px; border-bottom: 1px solid var(--grid); }
  td { padding: 5px 8px; border-bottom: 1px solid var(--grid); color: var(--ink-2); font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.04); }
  .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
  footer { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .mono { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header>
  <h1>CREED</h1>
  <span class="sub" id="gen">loading…</span>
  <span class="sub" id="mkt"></span>
</header>

<div id="banner" class="banner" style="display:none"></div>

<div class="grid" id="tiles"></div>

<section class="block">
  <h2>AUGUST — 0DTE bot</h2>
  <div id="august" class="sub2">—</div>
</section>

<section class="block">
  <h2>Signal tournament — today</h2>
  <div class="tags" id="tags"></div>
  <div id="signals"></div>
</section>

<footer>
  Paper account · TEST_MODE tournament · auto-refresh 60s · generated by CREED publisher · not financial advice
</footer>

<script>
// If a gist is configured, put its RAW url here; otherwise the page reads a
// sibling state.json (works for local previews and if the publisher commits
// to the Pages repo directly).
const GIST_RAW_URL = "";  // e.g. https://gist.githubusercontent.com/<user>/<id>/raw/state.json
const SRC = GIST_RAW_URL || "state.json";

const STRAT_COLORS = { shakedown_v1: "var(--s1)", vwap_v1: "var(--s2)", ema9x21_v1: "var(--s3)", orb15_v1: "var(--s4)" };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function tile(title, statusHtml, subHtml) {
  return `<div class="card"><h2>${title}</h2>${statusHtml}${subHtml ? `<div class="sub2">${subHtml}</div>` : ""}</div>`;
}
function statusLine(state, label) {
  const cls = state === "up" ? "up" : (state === "disabled" ? "off" : "down");
  const txt = state === "up" ? (label || "UP") : (state === "disabled" ? "disabled" : "DOWN");
  return `<div class="statusline"><span class="dot ${cls}"></span>${esc(txt)}</div>`;
}

function render(st) {
  const gen = new Date(st.generated_at);
  const ageMin = (Date.now() - gen.getTime()) / 60000;
  document.getElementById("gen").innerHTML =
    `updated ${gen.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"})}` +
    (ageMin > 15 ? ` <span class="stale">⚠ ${Math.round(ageMin)} min old</span>` : "");
  document.getElementById("mkt").textContent =
    st.market_open === true ? "· market OPEN" : st.market_open === false ? "· market closed" : "";

  const banner = document.getElementById("banner");
  if (st.alerts && st.alerts.length) {
    banner.style.display = "";
    banner.innerHTML = st.alerts.map(a =>
      `<div><span class="lvl ${esc(a.level)}">${esc(a.level).toUpperCase()}</span><span>${esc(a.msg)}</span></div>`).join("");
  } else banner.style.display = "none";

  const acct = st.account || {};
  const pl = acct.day_pl, plCls = pl > 0 ? "pl-pos" : pl < 0 ? "pl-neg" : "";
  const plTxt = pl == null ? "—" : `${pl >= 0 ? "+" : "−"}$${Math.abs(pl).toFixed(2)}`;
  const plPct = acct.day_pl_pct == null ? "" : ` (${acct.day_pl_pct >= 0 ? "+" : ""}${acct.day_pl_pct}%)`;
  document.getElementById("tiles").innerHTML =
    tile("Server", statusLine(st.components?.server)) +
    tile("Tunnel", statusLine(st.components?.tunnel), st.components?.url_pending ? "URL re-point pending" : "") +
    tile("Paper equity", `<div class="big mono">${acct.equity != null ? "$" + acct.equity.toLocaleString(undefined, {minimumFractionDigits: 2}) : "—"}</div>`) +
    tile("Day P/L", `<div class="big mono ${plCls}">${plTxt}</div>`, plPct.trim());

  const aug = st.august || {};
  document.getElementById("august").innerHTML =
    `<span class="tag"><span class="dot ${aug.enabled ? "up" : "off"}"></span>${aug.enabled ? "enabled" : "disabled"} · mode: ${esc(aug.mode)}</span>` +
    `<div class="sub2" style="margin-top:8px">${esc(aug.today)}</div>`;

  const t = st.tournament || {};
  const tags = Object.entries(t.by_strategy || {}).map(([k, v]) =>
    `<span class="tag"><span class="dot" style="background:${STRAT_COLORS[k] || "var(--muted)"}"></span>${esc(k)} · ${v}</span>`).join("");
  document.getElementById("tags").innerHTML =
    `<span class="tag">signals today · <b>&nbsp;${t.signals_today ?? 0}</b></span>` + tags;
  document.getElementById("signals").innerHTML = (t.recent && t.recent.length)
    ? `<table><tr><th>time</th><th>strategy</th><th>action</th><th>sl</th><th>tp</th><th>status</th></tr>` +
      t.recent.map(r => `<tr><td>${esc(r.at)}</td><td><span class="dot" style="background:${STRAT_COLORS[r.strategy] || "var(--muted)"};display:inline-block;margin-right:6px"></span>${esc(r.strategy)}</td><td>${esc(r.action)}</td><td>${r.sl ?? ""}</td><td>${r.tp ?? ""}</td><td>${esc(r.status)}</td></tr>`).join("") + `</table>`
    : `<div class="empty">No signals yet today.</div>`;
}

async function load() {
  try {
    const r = await fetch(SRC + (SRC.includes("?") ? "&" : "?") + "t=" + Date.now(), {cache: "no-store"});
    render(await r.json());
  } catch (e) {
    document.getElementById("gen").innerHTML = `<span class="stale">⚠ cannot load state.json</span>`;
  }
}
load();
setInterval(load, 60000);
</script>
</body>
</html>
