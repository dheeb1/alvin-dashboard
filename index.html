<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CREED</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --page:        #1a35a8;   /* royal blue, deep */
    --surface:     #2447cf;   /* royal blue, card */
    --ink:         #ffffff;
    --ink-2:       #e8edff;
    --muted:       #b9c6f5;
    --grid:        rgba(255,255,255,0.22);
    --ring:        rgba(255,255,255,0.28);
    --good:        #3ef07f;   /* bright green: all systems go */
    --warning:     #ffd54a;
    --serious:     #ffa04d;
    --critical:    #ff4b4b;   /* bright red: errors */
    --up:          #3ef07f;
    --down:        #ff4b4b;
    --s1: #ffd166; --s2: #ff8c5a; --s3: #55e0d2; --s4: #c6b3ff;
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    background: var(--page); color: var(--ink);
    font: 500 15px/1.45 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 20px; max-width: 980px; margin: 0 auto;
  }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  header h1 { font-size: 24px; letter-spacing: 5px; font-weight: 900; }
  header .sub { color: var(--muted); font-size: 13px; }
  .stale { color: var(--warning); }
  .banner {
    border: 1px solid var(--ring); border-left: 4px solid var(--critical);
    background: var(--surface); border-radius: 8px; padding: 12px 16px; margin-bottom: 16px;
  }
  .banner div { display: flex; gap: 8px; align-items: baseline; padding: 2px 0; }
  .banner .lvl { font-size: 12px; font-weight: 700; letter-spacing: 1px; }
  .lvl.critical { color: var(--critical); } .lvl.serious { color: var(--serious); }
  .lvl.warning { color: var(--warning); }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); margin-bottom: 16px; }
  .card {
    background: var(--surface); border: 1px solid var(--ring);
    border-radius: 10px; padding: 14px 16px;
  }
  .card h2 { font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
  .big { font-size: 28px; font-weight: 900; }
  .statusline { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 800; }
  .statusline.is-up { color: var(--good); } .statusline.is-down { color: var(--critical); }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .dot.up { background: var(--up); } .dot.down { background: var(--down); }
  .dot.off { background: var(--muted); }
  .sub2 { color: var(--ink-2); font-size: 13px; margin-top: 4px; }
  .pl-pos { color: var(--good); } .pl-neg { color: var(--down); }
  section.block { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
  section.block h2 { font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; }
  .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .tag { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--ring); border-radius: 999px; padding: 3px 10px; font-size: 13px; color: var(--ink-2); }
  .tag .dot { width: 8px; height: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 600; padding: 4px 8px; border-bottom: 1px solid var(--grid); }
  td { padding: 5px 8px; border-bottom: 1px solid var(--grid); color: var(--ink-2); font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.08); }
  .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
  footer { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .mono { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header>
  <h1>CREED</h1>
  <span class="sub" id="gen">loading…</span>
  <span class="sub" id="mkt"></span>
</header>

<div id="banner" class="banner" style="display:none"></div>

<div class="grid" id="tiles"></div>

<section class="block">
  <h2>AUGUST — 0DTE strategy roster</h2>
  <div id="august" class="sub2">—</div>
  <div id="augroster" style="margin-top:10px"></div>
  <div id="aughist" style="margin-top:10px"></div>
</section>

<section class="block">
  <h2>Signal tournament — today</h2>
  <div class="tags" id="tags"></div>
  <div id="signals"></div>
</section>

<section class="block">
  <h2>Rejected — today <span style="font-weight:500;color:var(--muted);text-transform:none;letter-spacing:0">(the trades we did NOT take — control-group data)</span></h2>
  <div id="rejects"></div>
</section>

<footer>
  Paper account · TEST_MODE tournament · auto-refresh 60s · generated by CREED publisher · not financial advice
</footer>

<script>
// If a gist is configured, put its RAW url here; otherwise the page reads a
// sibling state.json (works for local previews and if the publisher commits
// to the Pages repo directly).
const GIST_RAW_URL = "https://gist.githubusercontent.com/dheeb1/fecd5b57d51c7c8f04b8a866c03809cf/raw/state.json";
const SRC = GIST_RAW_URL || "state.json";

const STRAT_COLORS = { shakedown_v1: "var(--s1)", vwap_v1: "var(--s2)", ema9x21_v1: "var(--s3)", orb15_v1: "var(--s4)" };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function spark(hist) {
  if (!hist || hist.length < 2) return `<div class="sub2">equity history: collecting (day ${hist ? hist.length : 0})</div>`;
  const vals = hist.map(p => p.eq), min = Math.min(...vals), max = Math.max(...vals), span = (max - min) || 1;
  const pts = vals.map((v, i) => `${(i / (vals.length - 1) * 196 + 2).toFixed(1)},${(34 - (v - min) / span * 28 + 3).toFixed(1)}`).join(" ");
  const upTrend = vals[vals.length - 1] >= vals[0];
  return `<svg viewBox="0 0 200 40" style="width:100%;height:40px;margin-top:6px" role="img" aria-label="equity, last ${hist.length} days">
    <polyline points="${pts}" fill="none" stroke="${upTrend ? "var(--good)" : "var(--critical)"}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}
function tile(title, statusHtml, subHtml) {
  return `<div class="card"><h2>${title}</h2>${statusHtml}${subHtml ? `<div class="sub2">${subHtml}</div>` : ""}</div>`;
}
function statusLine(state, label) {
  const cls = state === "up" ? "up" : (state === "disabled" ? "off" : "down");
  const txt = state === "up" ? (label || "UP") : (state === "disabled" ? "disabled" : "DOWN");
  return `<div class="statusline ${cls === "up" ? "is-up" : cls === "down" ? "is-down" : ""}"><span class="dot ${cls}"></span>${esc(txt)}</div>`;
}

function render(st) {
  const gen = new Date(st.generated_at);
  const ageMin = (Date.now() - gen.getTime()) / 60000;
  document.getElementById("gen").innerHTML =
    `updated ${gen.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"})}` +
    (ageMin > 15 ? ` <span class="stale">⚠ ${Math.round(ageMin)} min old</span>` : "");
  document.getElementById("mkt").textContent =
    st.market_open === true ? "· market OPEN" : st.market_open === false ? "· market closed" : "";

  const banner = document.getElementById("banner");
  if (st.alerts && st.alerts.length) {
    banner.style.display = "";
    banner.innerHTML = st.alerts.map(a =>
      `<div><span class="lvl ${esc(a.level)}">${esc(a.level).toUpperCase()}</span><span>${esc(a.msg)}</span></div>`).join("");
  } else banner.style.display = "none";

  const acct = st.account || {};
  const pl = acct.day_pl, plCls = pl > 0 ? "pl-pos" : pl < 0 ? "pl-neg" : "";
  const plTxt = pl == null ? "—" : `${pl >= 0 ? "+" : "−"}$${Math.abs(pl).toFixed(2)}`;
  const plPct = acct.day_pl_pct == null ? "" : ` (${acct.day_pl_pct >= 0 ? "+" : ""}${acct.day_pl_pct}%)`;
  const rs = st.risk_state || {};
  const riskHtml =
    `<div class="statusline ${rs.test_mode ? "" : "is-up"}" style="${rs.test_mode ? "color:var(--warning)" : ""}"><span class="dot" style="background:${rs.test_mode ? "var(--warning)" : "var(--good)"}"></span>${rs.test_mode ? "TEST MODE — echo only" : "LIVE " + esc(rs.trading_mode || "")}</div>` +
    (rs.august_halted ? `<div class="statusline is-down" style="margin-top:6px"><span class="dot down"></span>AUGUST HALTED</div>` : "");
  document.getElementById("tiles").innerHTML =
    tile("Server", statusLine(st.components?.server)) +
    tile("Tunnel", statusLine(st.components?.tunnel), st.components?.url_pending ? "URL re-point pending" : "") +
    tile("Risk interlocks", riskHtml, rs.trading_enabled === false ? "trading disabled (kill switch)" : "") +
    tile("Paper equity", `<div class="big mono">${acct.equity != null ? "$" + acct.equity.toLocaleString(undefined, {minimumFractionDigits: 2}) : "—"}</div>${spark(acct.history)}`) +
    tile("Day P/L", `<div class="big mono ${plCls}">${plTxt}</div>`, plPct.trim());

  const aug = st.august || {};
  document.getElementById("august").innerHTML =
    `<span class="tag"><span class="dot ${aug.enabled ? "up" : "off"}"></span>${aug.enabled ? "enabled" : "disabled"} · mode: ${esc(aug.mode)}</span>` +
    `<div class="sub2" style="margin-top:8px">${esc(aug.today)}</div>`;
  const SLOT_COLORS = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)"];
  const money = v => `${v >= 0 ? "+" : "−"}$${Math.abs(v).toFixed(2)}`;
  const slots = aug.slots || [];
  document.getElementById("augroster").innerHTML = slots.length
    ? `<table><tr><th>slot</th><th>entry CT</th><th>today's signal</th><th>today's trade</th><th>record</th></tr>` +
      slots.map((s, i) => {
        const dot = `<span class="dot" style="background:${SLOT_COLORS[i % 4]};display:inline-block;margin-right:6px"></span>`;
        let tradeHtml = `<span style="color:var(--muted)">—</span>`;
        if (s.trade) {
          tradeHtml = s.trade.open
            ? `<span style="color:var(--warning);font-weight:700">OPEN</span> ${esc(s.trade.dir)} @ ${s.trade.entry}`
            : `<span class="${s.trade.pnl >= 0 ? "pl-pos" : "pl-neg"}" style="font-weight:700">${money(s.trade.pnl)}</span> <span style="color:var(--muted)">${esc(s.trade.reason)}</span>`;
        }
        const r = s.record || {};
        const recHtml = r.n
          ? `${r.w}/${r.n} · <span class="${r.net >= 0 ? "pl-pos" : "pl-neg"}">${money(r.net)}</span>`
          : `<span style="color:var(--muted)">no fills yet</span>`;
        return `<tr${s.enabled ? "" : ' style="opacity:.45"'}><td>${dot}${esc(s.name)}</td><td>${esc(s.entry_ct)}</td><td>${esc(s.signal)}</td><td>${tradeHtml}</td><td class="mono">${recHtml}</td></tr>`;
      }).join("") + `</table>`
    : "";
  document.getElementById("aughist").innerHTML = (aug.history && aug.history.length)
    ? `<table><tr><th>date</th><th>mode</th><th>session verdict</th></tr>` +
      aug.history.map(h => `<tr><td>${esc(h.d)}</td><td>${esc(h.mode)}</td><td>${esc(h.verdict)}</td></tr>`).join("") + `</table>`
    : "";

  const rj = st.rejects || {};
  document.getElementById("rejects").innerHTML = (rj.recent && rj.recent.length)
    ? `<div class="tags"><span class="tag"><span class="dot" style="background:var(--serious)"></span>rejected today · <b>&nbsp;${rj.today}</b></span></div>` +
      `<table><tr><th>time</th><th>kind</th><th>detail</th></tr>` +
      rj.recent.map(r => `<tr><td>${esc(r.at)}</td><td>${esc(r.kind)}</td><td>${esc(r.detail)}</td></tr>`).join("") + `</table>`
    : `<div class="empty">Nothing rejected today — every arrival authenticated and passed the gates.</div>`;

  const t = st.tournament || {};
  const tags = Object.entries(t.by_strategy || {}).map(([k, v]) =>
    `<span class="tag"><span class="dot" style="background:${STRAT_COLORS[k] || "var(--muted)"}"></span>${esc(k)} · ${v}</span>`).join("");
  document.getElementById("tags").innerHTML =
    `<span class="tag">signals today · <b>&nbsp;${t.signals_today ?? 0}</b></span>` + tags;
  document.getElementById("signals").innerHTML = (t.recent && t.recent.length)
    ? `<table><tr><th>time</th><th>strategy</th><th>action</th><th>sl</th><th>tp</th><th>status</th></tr>` +
      t.recent.map(r => `<tr><td>${esc(r.at)}</td><td><span class="dot" style="background:${STRAT_COLORS[r.strategy] || "var(--muted)"};display:inline-block;margin-right:6px"></span>${esc(r.strategy)}</td><td>${esc(r.action)}</td><td>${r.sl ?? ""}</td><td>${r.tp ?? ""}</td><td>${esc(r.status)}</td></tr>`).join("") + `</table>`
    : `<div class="empty">No signals yet today.</div>`;
}

async function load() {
  try {
    const r = await fetch(SRC + (SRC.includes("?") ? "&" : "?") + "t=" + Date.now(), {cache: "no-store"});
    render(await r.json());
  } catch (e) {
    document.getElementById("gen").innerHTML = `<span class="stale">⚠ cannot load state.json</span>`;
  }
}
load();
setInterval(load, 60000);
</script>
</body>
</html>
